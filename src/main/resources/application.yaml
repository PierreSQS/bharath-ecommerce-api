spring:
  application:
    name: ecommerce-api
  output:
    ansi:
      # Forced instead of DETECT so console colors survive non-TTY streams (e.g. Docker).
      enabled: always
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates the mapping against it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        highlight_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration


