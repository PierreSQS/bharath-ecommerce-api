name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (SpringBoot 4.1.0 + MySQL 9.5)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9.5
        env:
          # Throwaway CI credentials - the container is destroyed with the job.
          MYSQL_DATABASE: ecommerce_db
          MYSQL_USER: ecommerce
          MYSQL_PASSWORD: ecommerce
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The repo is developed on Windows, so mvnw may arrive without the exec bit.
      - name: Make the Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run the tests
        env:
          # EcommerceApiApplicationTests pins spring.docker.compose.skip.in-tests=false,
          # which an env var cannot override. Disabling the integration outright takes
          # precedence, so the smoke test uses the MySQL service container instead.
          SPRING_DOCKER_COMPOSE_ENABLED: 'false'
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/ecommerce_db
          SPRING_DATASOURCE_USERNAME: ecommerce
          SPRING_DATASOURCE_PASSWORD: ecommerce
        run: ./mvnw -B test

      - name: Upload the surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  build-and-push:
    name: Build and push the image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # The builder stage already runs with -DskipTests; the test job above is the gate.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
